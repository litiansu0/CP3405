<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seminar – JCU Seminar Q&amp;A</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <p class="brand">JCU Seminar Q&amp;A</p>
      <a class="header-link" href="index.html" id="leave-link">Leave seminar</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1 id="seminar-title">Seminar</h1>
      <!-- PBI-02: current identity is always visible -->
      <p class="identity">
        You are posting as: <span id="identity-badge" class="badge"></span>
      </p>
    </section>

    <!-- PBI-03: ask a question -->
    <section class="card" aria-labelledby="ask-heading">
      <h2 id="ask-heading">Ask a question</h2>
      <form id="ask-form" novalidate>
        <div class="field">
          <label for="question-text">Your question</label>
          <textarea id="question-text" name="question" rows="4" maxlength="300"
                    aria-describedby="char-count question-error"></textarea>
          <p id="char-count" class="hint small">0 / 300 characters</p>
          <p id="question-error" class="error-text" role="alert"></p>
        </div>
        <button type="submit" class="btn btn-primary">Submit question</button>
      </form>
      <p id="confirmation" class="confirmation" role="status" hidden></p>
    </section>

    <!-- PBI-04: shared class feed -->
    <section class="card" aria-labelledby="feed-heading">
      <div class="section-head">
        <h2 id="feed-heading">Class questions <span id="feed-count" class="count-pill"></span></h2>
        <div class="toolbar">
          <label for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="top">Top (most votes)</option>
            <option value="newest">Newest</option>
          </select>
        </div>
      </div>
      <!-- PBI-06: status legend -->
      <div id="legend"></div>
      <p id="feed-empty" class="hint" hidden>No questions yet. Be the first to ask!</p>
      <ul id="feed-list" class="question-list"></ul>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/seminar.js"></script>
</body>
</html>

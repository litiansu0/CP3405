<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecturer dashboard – JCU Seminar Q&amp;A</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <p class="brand">JCU Seminar Q&amp;A · Lecturer</p>
      <a class="header-link" href="index.html">Student view</a>
    </div>
  </header>

  <main class="container">
    <!-- PBI-07: open a seminar by class code -->
    <section class="card narrow" id="open-section" aria-labelledby="open-heading">
      <h1 id="open-heading">Lecturer dashboard</h1>
      <p class="hint">Enter the class code of the seminar you are teaching.</p>
      <form id="open-form" novalidate>
        <div class="field">
          <label for="lecturer-code">Class code</label>
          <input id="lecturer-code" type="text" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" maxlength="12" aria-describedby="lecturer-code-error">
          <p id="lecturer-code-error" class="error-text" role="alert"></p>
        </div>
        <button type="submit" class="btn btn-primary">Open dashboard</button>
      </form>
      <p class="hint small">Demo codes: <strong>CP3405</strong> or <strong>CP2408</strong></p>
    </section>

    <!-- PBI-07: dashboard -->
    <div id="dashboard" hidden>
      <section class="card">
        <div class="section-head">
          <h1 id="dashboard-title">Seminar</h1>
          <button type="button" class="btn btn-secondary" id="change-seminar">Change seminar</button>
        </div>
        <!-- PBI-06 + PBI-07: counts per status -->
        <ul class="stats" id="stats" aria-label="Question counts"></ul>
      </section>

      <section class="card" aria-labelledby="questions-heading">
        <div class="section-head">
          <h2 id="questions-heading">Questions <span id="list-count" class="count-pill"></span></h2>
          <div class="toolbar">
            <label for="filter-select">Status</label>
            <select id="filter-select">
              <option value="all">All statuses</option>
              <option value="submitted">Submitted</option>
              <option value="seen">Seen</option>
              <option value="answered">Answered</option>
            </select>
            <label for="lecturer-sort">Sort by</label>
            <select id="lecturer-sort">
              <option value="votes">Most votes</option>
              <option value="newest">Newest</option>
            </select>
          </div>
        </div>
        <div id="legend"></div>
        <p id="list-empty" class="hint" hidden>No questions match this filter.</p>
        <ul id="question-list" class="question-list"></ul>
      </section>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/lecturer.js"></script>
</body>
</html>
